name: Android Build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
          validate-wrappers: false
          cache-disabled: true
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Assets
        run: |
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">Study Thor</string></resources>' > android/app/src/main/res/values/strings.xml
      - name: Clean Broken Assets
        run: |
          find android/app/src/main/res/ -name "ic_launcher_background.png" -delete || true
      - name: Capacitor Sync
        run: npx cap sync android
      - name: Aggressive Cache Clean
        run: |
          rm -rf ~/.gradle/caches/
          rm -f android/gradle/wrapper/gradle-wrapper.jar
      - name: Generate Keystore
        run: |
          cd android/app
          rm -f release.keystore
          keytool -genkey -v -keystore release.keystore -alias studythor -keyalg RSA -keysize 2048 -validity 10000 -storepass study123 -keypass study123 -dname "CN=Study Thor, OU=Study, O=Study, L=Delhi, ST=Delhi, C=IN"
      - name: Build Android App
        run: |
          cd android
          gradle assembleRelease -Pandroid.injected.signing.storeFile=release.keystore -Pandroid.injected.signing.storePassword=study123 -Pandroid.injected.signing.keyAlias=studythor -Pandroid.injected.signing.keyPassword=study123 --no-daemon --refresh-dependencies
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
